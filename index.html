<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>StabexPay - 비커스터디 스테이블코인 수납 도구</title> <script src="https://unpkg.com/react@18/umd/react.development.js"></script> <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> <script src="https://cdn.tailwindcss.com"></script> <style> .qr-code { image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; } .loading-spinner { animation: spin 1s linear infinite; } @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } </style> </head> <body> <div id="root"></div> <script type="text/babel"> /* * StabexPay v1.1 - 비커스터디 스테이블코인 수납 도구 * 작성일: 2024년 12월 * * ⚠️ 면책 조항: * - 이 도구는 비커스터디/비환전 도구입니다 * - 사용자가 직접 메타마스크로 토큰을 전송합니다 * - 환전, 정산, 대리송금, 커스터디 기능을 제공하지 않습니다 * - 온체인 확인만 제공하며, 모든 책임은 사용자에게 있습니다 * * 🔧 사용법: * 1. 상점 설정: 프로필과 수취 지갑 등록 * 2. 결제 링크 생성: 금액과 토큰 설정 후 QR/링크 생성 * 3. 결제: 생성된 링크에서 메타마스크로 토큰 전송 * 4. 확인: 온체인에서 자동 확인 후 대시보드에 반영 * * 🌐 지원 체인: EVM 호환 체인 (Polygon, Base, Arbitrum 등) * 💰 지원 토큰: ERC-20 스테이블코인 (USDT, USDC 등) * * 📋 테스트 시나리오: * 1. 상점 설정 * - 지갑: MetaMask 계정 주소 복사해서 입력 (개인 EOA 주소) * - 토큰: Polygon USDC 0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174, decimals=6 * 2. 인보이스 생성 (예: 1.23 USDC) → 링크/QR 생성 * 3. 결제 페이지: MetaMask 연결 → 네트워크 전환 → 전송 * 4. 상태 진행: PENDING → PAID(전송완료) → CONFIRMED(6컨펌) * 5. 대시보드에서 같은 ID 인보이스가 CONFIRMED로 변경 확인 * 6. CSV 내보내기 동작 확인 * * 💡 추가 개선 계획: * - Transfer 이벤트 로그 매칭 (topic: 0xddf252ad...) * - 가스 추정: eth_estimateGas로 가스 부족 방지 * - 임베드 코드: iframe 스니펫 제공 * - SDK: 인보이스 payload 생성기 JS 스니펫 * * ⚠️ 제한사항: * - MetaMask 필수 (웹3 지갑 연결) * - 로컬 저장소 사용 (브라우저 캐시 삭제 시 데이터 손실) * - 실시간 환율 API 없음 (수동 토큰 수량 입력) * - TRON 네트워크 미지원 (EVM만 지원) */ const { useState, useEffect, useRef } = React; // ============================================================================ // UTILITY FUNCTIONS // ============================================================================ // 지갑 주소 검증 (단순화) function isValidEthereumAddress(address) { return /^0x[a-fA-F0-9]{40}$/.test(address || ''); } // 토큰 수량을 Wei 단위로 변환 (정밀도 보장) function toUnit(amountStr, decimals) { const s = String(amountStr || '').trim(); if (!/^\d+(\.\d+)?$/.test(s)) return '0'; const [intPart, fracPartRaw=''] = s.split('.'); const frac = (fracPartRaw + '0'.repeat(decimals)).slice(0, decimals); const joined = (intPart.replace(/^0+/, '') || '0') + frac; return (joined.replace(/^0+/, '') || '0'); } // 32바이트 좌측 패딩 헥스 인코더 function padHex(value, length = 64) { const hex = typeof value === 'string' ? value.replace('0x', '') : value.toString(16); return '0x' + hex.padStart(length, '0'); } // ERC-20 transfer 함수 인코딩 function encodeTransfer(to, amount) { const methodId = '0xa9059cbb'; // transfer(address,uint256) const paddedTo = padHex(to.replace('0x', ''), 64); const paddedAmount = padHex(BigInt(amount).toString(16), 64); return methodId + paddedTo.slice(2) + paddedAmount.slice(2); } // QR 코드 URL 생성 (외부 API 사용) function qrSrc(text, size = 200) { return https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}; } // CSV 내보내기 function exportToCSV(data, filename) { const headers = ['ID', '제목', '상태', '체인', '토큰', '금액', '수취주소', 'TxHash', '생성일시', '확정일시']; const csvContent = [ headers.join(','), ...data.map(item => [ item.id, "${item.payload.title || ''}", item.status, item.payload.chainId, item.payload.token.symbol, item.payload.amountToken, item.payload.to, item.txHash || '', new Date(item.createdAt).toLocaleString(), item.confirmedAt ? new Date(item.confirmedAt).toLocaleString() : '' ].join(',')) ].join('\n'); const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename; link.click(); } // 체인 정보 const CHAINS = { 137: { name: 'Polygon', rpc: 'https://polygon-rpc.com/' }, 8453: { name: 'Base', rpc: 'https://mainnet.base.org' }, 42161: { name: 'Arbitrum', rpc: 'https://arb1.arbitrum.io/rpc' }, 80001: { name: 'Polygon Mumbai', rpc: 'https://rpc-mumbai.maticvigil.com/' } }; // ============================================================================ // STORAGE MANAGEMENT // ============================================================================ function saveToStorage(key, data) { localStorage.setItem(key, JSON.stringify(data)); } function loadFromStorage(key, defaultValue = null) { try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultValue; } catch { return defaultValue; } } // ============================================================================ // MAIN APP COMPONENT // ============================================================================ function App() { const [currentView, setCurrentView] = useState('dashboard'); const [invoices, setInvoices] = useState([]); const [shopSettings, setShopSettings] = useState(null); const [web3Provider, setWeb3Provider] = useState(null); const [account, setAccount] = useState(null); // URL 파라미터에서 인보이스 페이로드 확인 useEffect(() => { const urlParams = new URLSearchParams(window.location.search); const invoiceId = urlParams.get('i'); if (invoiceId) { setCurrentView('pay'); } // 로컬 스토리지에서 데이터 로드 const savedInvoices = loadFromStorage('stabexpay_invoices', []); const savedSettings = loadFromStorage('stabexpay_shop_settings'); setInvoices(savedInvoices); setShopSettings(savedSettings); // 메타마스크 연결 확인 if (window.ethereum) { setWeb3Provider(window.ethereum); window.ethereum.request({ method: 'eth_accounts' }) .then(accounts => { if (accounts.length > 0) { setAccount(accounts[0]); } }); } // 해시 라우팅 const handleHashChange = () => { const hash = window.location.hash.slice(1); if (hash) { setCurrentView(hash); } }; window.addEventListener('hashchange', handleHashChange); handleHashChange(); return () => window.removeEventListener('hashchange', handleHashChange); }, []); // 인보이스 저장 useEffect(() => { saveToStorage('stabexpay_invoices', invoices); }, [invoices]); // 상점 설정 저장 useEffect(() => { if (shopSettings) { saveToStorage('stabexpay_shop_settings', shopSettings); } }, [shopSettings]); const connectWallet = async () => { if (!window.ethereum) { alert('MetaMask가 설치되지 않았습니다.'); return; } try { const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' }); setAccount(accounts[0]); } catch (error) { console.error('지갑 연결 실패:', error); } }; const addInvoice = (invoice) => { setInvoices(prev => [...prev, invoice]); }; const updateInvoice = (id, updates) => { setInvoices(prev => prev.map(inv => (inv.id === id || inv.payload?.id === id) ? { ...inv, ...updates } : inv )); }; // 현재 뷰 렌더링 const renderCurrentView = () => { switch (currentView) { case 'settings': return <ShopSettings settings={shopSettings} onSave={setShopSettings} onNavigate={setCurrentView} />; case 'create': return <CreateInvoice settings={shopSettings} onInvoiceCreate={addInvoice} onNavigate={setCurrentView} />; case 'pay': return <PaymentPage provider={web3Provider} account={account} onConnect={connectWallet} onInvoiceUpdate={updateInvoice} />; default: return <Dashboard invoices={invoices} settings={shopSettings} onNavigate={setCurrentView} onInvoiceUpdate={updateInvoice} />; } }; return ( <div className="min-h-screen bg-gray-50"> {/* 상단 경고 배너 */} <div className="bg-yellow-100 border-l-4 border-yellow-500 p-4"> <div className="flex"> <div className="flex-shrink-0"> <svg className="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor"> <path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd" /> </svg> </div> <div className="ml-3"> <p className="text-sm text-yellow-700"> <strong>비커스터디/비환전</strong> 도구입니다. 이 도구는 결제 링크/QR 코드 생성과 온체인 확인만 제공합니다. 모든 토큰 전송은 사용자가 직접 MetaMask를 통해 수행하며, 환전이나 정산 기능은 제공하지 않습니다. </p> </div> </div> </div> {/* 메인 네비게이션 */} {currentView !== 'pay' && ( <nav className="bg-white shadow"> <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"> <div className="flex justify-between h-16"> <div className="flex"> <div className="flex-shrink-0 flex items-center"> <h1 className="text-xl font-bold text-gray-900">StabexPay</h1> </div> <div className="hidden sm:ml-6 sm:flex sm:space-x-8"> <button onClick={() => setCurrentView('dashboard')} className={${currentView === 'dashboard' ? 'border-indigo-500 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium} > 대시보드 </button> <button onClick={() => setCurrentView('create')} className={${currentView === 'create' ? 'border-indigo-500 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium} > 인보이스 생성 </button> <button onClick={() => setCurrentView('settings')} className={${currentView === 'settings' ? 'border-indigo-500 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium} > 상점 설정 </button> </div> </div> <div className="flex items-center"> {account ? ( <span className="text-sm text-gray-500"> {account.slice(0, 6)}...{account.slice(-4)} </span> ) : ( <button onClick={connectWallet} className="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700" > 지갑 연결 </button> )} </div> </div> </div> </nav> )} {/* 메인 컨텐츠 */} <main className="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8"> {renderCurrentView()} </main> </div> ); } // ============================================================================ // SHOP SETTINGS COMPONENT // ============================================================================ function ShopSettings({ settings, onSave, onNavigate }) { const [formData, setFormData] = useState({ shopName: '', logoUrl: '', contactEmail: '', wallets: [], tokens: [], ...settings }); const [newWallet, setNewWallet] = useState({ name: '', address: '', chainId: '', isDefault: false }); const [newToken, setNewToken] = useState({ symbol: '', decimals: '', contract: '', chainId: '' }); const addWallet = () => { if (!newWallet.name || !newWallet.address || !newWallet.chainId) { alert('모든 필드를 입력해주세요.'); return; } if (!isValidEthereumAddress(newWallet.address)) { alert('유효하지 않은 지갑 주소입니다.'); return; } const updatedWallets = [...formData.wallets, { ...newWallet, id: Date.now().toString(), chainId: parseInt(newWallet.chainId) }]; if (newWallet.isDefault) { updatedWallets.forEach((w, i) => { if (i < updatedWallets.length - 1) w.isDefault = false; }); } setFormData({ ...formData, wallets: updatedWallets }); setNewWallet({ name: '', address: '', chainId: '', isDefault: false }); }; const addToken = () => { if (!newToken.symbol || !newToken.decimals || !newToken.contract || !newToken.chainId) { alert('모든 필드를 입력해주세요.'); return; } if (!isValidEthereumAddress(newToken.contract)) { alert('유효하지 않은 컨트랙트 주소입니다.'); return; } setFormData({ ...formData, tokens: [...formData.tokens, { ...newToken, id: Date.now().toString(), decimals: parseInt(newToken.decimals), chainId: parseInt(newToken.chainId) }] }); setNewToken({ symbol: '', decimals: '', contract: '', chainId: '' }); }; const handleSave = () => { if (!formData.shopName) { alert('상점명은 필수입니다.'); return; } if (formData.wallets.length === 0) { alert('최소 하나의 지갑을 등록해야 합니다.'); return; } onSave(formData); alert('설정이 저장되었습니다.'); onNavigate('dashboard'); }; return ( <div className="max-w-4xl mx-auto"> <div className="bg-white shadow rounded-lg"> <div className="px-4 py-5 sm:p-6"> <h3 className="text-lg leading-6 font-medium text-gray-900 mb-6"> 상점 설정 </h3> {/* 기본 정보 */} <div className="space-y-6"> <div> <label className="block text-sm font-medium text-gray-700"> 상점명 * </label> <input type="text" value={formData.shopName} onChange={(e) => setFormData({ ...formData, shopName: e.target.value })} className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="예: ABC 상점" /> </div> <div> <label className="block text-sm font-medium text-gray-700"> 로고 URL (선택) </label> <input type="url" value={formData.logoUrl} onChange={(e) => setFormData({ ...formData, logoUrl: e.target.value })} className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="https://example.com/logo.png" /> </div> <div> <label className="block text-sm font-medium text-gray-700"> 연락 이메일 (선택) </label> <input type="email" value={formData.contactEmail} onChange={(e) => setFormData({ ...formData, contactEmail: e.target.value })} className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="contact@example.com" /> </div> </div> {/* 지갑 관리 */} <div className="mt-8"> <h4 className="text-md font-medium text-gray-900 mb-4">수취 지갑</h4> {/* 기존 지갑 목록 */} {formData.wallets.length > 0 && ( <div className="mb-4 space-y-2"> {formData.wallets.map((wallet) => ( <div key={wallet.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-md"> <div> <span className="font-medium">{wallet.name}</span> {wallet.isDefault && <span className="ml-2 px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full">기본</span>} <div className="text-sm text-gray-500"> {wallet.address} ({CHAINS[wallet.chainId]?.name || Chain ${wallet.chainId}}) </div> </div> <button onClick={() => { setFormData({ ...formData, wallets: formData.wallets.filter(w => w.id !== wallet.id) }); }} className="text-red-600 hover:text-red-800" > 삭제 </button> </div> ))} </div> )} {/* 새 지갑 추가 */} <div className="grid grid-cols-1 md:grid-cols-2 gap-4"> <input type="text" placeholder=
